<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi primera página WebXR</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>
<body>
  <a-scene cursor="rayOrigin: mouse">
    <a-assets>
   <a-asset-item id="silla" src="activos/silla.glb">
   </a-asset-item>
   <audio id="campana" src="activos/campana.mp3">
   </audio>
   <audio id="golpe" src="activos/golpe.mp3">
   </audio>
  </a-assets>
    <a-box
      position="0 1 -3"
      rotation="0 45 0"
      color="#4CC3D9">
    </a-box>
    
  <a-plane
      rotation="-90 0 0"
      width="20"
      height="20"
      color="#7BC8A4">
    </a-plane>

   <a-sky color="#6bdb20"></a-sky>
  </a-scene>
</body>
</html>
