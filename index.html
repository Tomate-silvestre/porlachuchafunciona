<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Por la chucha funciona</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>
<body>
  <a-scene>

    <a-assets>
  <a-asset-item
    id="silla"
    src="/activos2/silla.glb">
  </a-asset-item>
</a-assets>
  
   <a-plane
      rotation="-90 0 0"
      width="20"
      height="20"
      color="#7BC8A4">
    </a-plane>

    <a-box
      position="0 1 -3"
      rotation="0 45 0"
      color="#4CC3D9">
    </a-box>
 
    <a-sphere
     position="0 1 3"
     rotation="0 0 0"
     color="#7d2181">
     
<a-entity
  gltf-model="#silla"
  position="0 0 3"
  scale="1 1 1">
</a-entity>

     <a-sky color="#C8A2C8"></a-sky>
  </a-scene>
</body>
</html>
